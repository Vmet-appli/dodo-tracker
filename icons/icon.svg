<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Moon -->
  <circle cx="256" cy="220" r="120" fill="#fef3c7"/>
  <circle cx="310" cy="180" r="90" fill="url(#bg)"/>
  
  <!-- Stars -->
  <circle cx="140" cy="140" r="8" fill="#fef3c7"/>
  <circle cx="380" cy="120" r="6" fill="#fef3c7"/>
  <circle cx="420" cy="200" r="5" fill="#fef3c7"/>
  <circle cx="100" cy="220" r="4" fill="#fef3c7"/>
  <circle cx="160" cy="300" r="6" fill="#fef3c7"/>
  
  <!-- Z letters for sleep -->
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#fef3c7" opacity="0.9">Z</text>
  <text x="360" y="280" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="#fef3c7" opacity="0.7">z</text>
  <text x="390" y="250" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#fef3c7" opacity="0.5">z</text>
  
  <!-- App name bar -->
  <rect x="60" y="380" width="392" height="80" rx="20" fill="rgba(255,255,255,0.15)"/>
  <text x="256" y="435" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">DodoTracker</text>
</svg>
