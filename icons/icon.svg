<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Moon -->
  <circle cx="240" cy="230" r="140" fill="#fef3c7"/>
  <circle cx="310" cy="180" r="110" fill="url(#bg)"/>
  
  <!-- Stars -->
  <circle cx="120" cy="120" r="12" fill="#fef3c7"/>
  <circle cx="400" cy="100" r="10" fill="#fef3c7"/>
  <circle cx="420" cy="220" r="8" fill="#fef3c7"/>
  <circle cx="90" cy="280" r="7" fill="#fef3c7"/>
  <circle cx="150" cy="380" r="9" fill="#fef3c7"/>
  <circle cx="380" cy="380" r="11" fill="#fef3c7"/>
  
  <!-- Z letters for sleep -->
  <text x="340" y="340" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#fef3c7" opacity="0.95">Z</text>
  <text x="390" y="290" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#fef3c7" opacity="0.75">z</text>
  <text x="425" y="250" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#fef3c7" opacity="0.55">z</text>
</svg>
