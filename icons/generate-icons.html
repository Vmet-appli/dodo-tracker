<!DOCTYPE html>
<html>
<head>
    <title>Générer les icônes DodoTracker</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1e293b; color: white; }
        canvas { border: 1px solid #444; margin: 10px; }
        .icons { display: flex; flex-wrap: wrap; gap: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4f46e5; color: white; border: none; border-radius: 8px; }
        a { color: #818cf8; }
    </style>
</head>
<body>
    <h1>🌙 Générateur d'icônes DodoTracker</h1>
    <p>Cliquez sur le bouton puis téléchargez chaque icône en cliquant dessus.</p>
    <button onclick="generateIcons()">Générer les icônes</button>
    <div class="icons" id="icons"></div>

    <script>
        const sizes = [180, 192, 512];
        
        function generateIcons() {
            const container = document.getElementById('icons');
            container.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#4f46e5');
                gradient.addColorStop(1, '#7c3aed');
                
                // Rounded rect background
                const radius = size * 0.2;
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, radius);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Moon
                const moonColor = '#fef3c7';
                ctx.fillStyle = moonColor;
                ctx.beginPath();
                ctx.arc(size * 0.47, size * 0.45, size * 0.27, 0, Math.PI * 2);
                ctx.fill();
                
                // Moon shadow (creates crescent)
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(size * 0.6, size * 0.35, size * 0.21, 0, Math.PI * 2);
                ctx.fill();
                
                // Stars
                ctx.fillStyle = moonColor;
                const stars = [
                    [0.23, 0.23, 0.024],
                    [0.78, 0.2, 0.02],
                    [0.82, 0.43, 0.016],
                    [0.18, 0.55, 0.014],
                    [0.29, 0.74, 0.018],
                    [0.74, 0.74, 0.022]
                ];
                stars.forEach(([x, y, r]) => {
                    ctx.beginPath();
                    ctx.arc(size * x, size * y, size * r, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Z letters
                ctx.font = `bold ${size * 0.16}px Arial`;
                ctx.fillStyle = 'rgba(254, 243, 199, 0.95)';
                ctx.fillText('Z', size * 0.66, size * 0.66);
                
                ctx.font = `bold ${size * 0.11}px Arial`;
                ctx.fillStyle = 'rgba(254, 243, 199, 0.75)';
                ctx.fillText('z', size * 0.76, size * 0.56);
                
                ctx.font = `bold ${size * 0.07}px Arial`;
                ctx.fillStyle = 'rgba(254, 243, 199, 0.55)';
                ctx.fillText('z', size * 0.83, size * 0.48);
                
                // Create download link
                const div = document.createElement('div');
                div.innerHTML = `<p>icon-${size}.png</p>`;
                
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.appendChild(canvas);
                div.appendChild(link);
                
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
