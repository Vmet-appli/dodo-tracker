<!DOCTYPE html>
<html>
<head>
    <title>Générateur d'icônes DodoTracker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e293b; color: white; }
        canvas { display: block; margin: 10px 0; border: 1px solid #444; }
        a { color: #818cf8; margin-right: 10px; }
        .icon-row { display: flex; align-items: center; gap: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🌙 Générateur d'icônes DodoTracker</h1>
    <p>Cliquez sur les liens pour télécharger chaque taille d'icône :</p>
    
    <div id="icons"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const row = document.createElement('div');
            row.className = 'icon-row';
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw the icon
            drawIcon(ctx, size);
            
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `icon-${size}.png`;
            link.textContent = `📥 icon-${size}.png`;
            
            const preview = document.createElement('span');
            preview.textContent = `${size}x${size}`;
            
            row.appendChild(canvas);
            row.appendChild(link);
            row.appendChild(preview);
            container.appendChild(row);
        });
        
        function drawIcon(ctx, size) {
            const scale = size / 512;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4f46e5');
            gradient.addColorStop(1, '#7c3aed');
            
            // Rounded rect background
            ctx.beginPath();
            const radius = 80 * scale;
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Moon
            ctx.beginPath();
            ctx.arc(256 * scale, 200 * scale, 120 * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#fef3c7';
            ctx.fill();
            
            // Moon shadow
            ctx.beginPath();
            ctx.arc(310 * scale, 160 * scale, 90 * scale, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Stars
            ctx.fillStyle = '#fef3c7';
            const stars = [
                [140, 140, 10],
                [380, 120, 8],
                [420, 200, 6],
                [100, 220, 5],
                [160, 300, 7],
                [90, 160, 4],
                [440, 300, 5]
            ];
            stars.forEach(([x, y, r]) => {
                ctx.beginPath();
                ctx.arc(x * scale, y * scale, r * scale, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Z letters
            ctx.font = `bold ${60 * scale}px Arial`;
            ctx.fillStyle = 'rgba(254, 243, 199, 0.9)';
            ctx.fillText('Z', 320 * scale, 320 * scale);
            
            ctx.font = `bold ${45 * scale}px Arial`;
            ctx.fillStyle = 'rgba(254, 243, 199, 0.7)';
            ctx.fillText('z', 370 * scale, 270 * scale);
            
            ctx.font = `bold ${30 * scale}px Arial`;
            ctx.fillStyle = 'rgba(254, 243, 199, 0.5)';
            ctx.fillText('z', 400 * scale, 230 * scale);
            
            // Bottom bar
            ctx.beginPath();
            const barY = 390 * scale;
            const barHeight = 70 * scale;
            const barRadius = 15 * scale;
            const barX = 60 * scale;
            const barWidth = 392 * scale;
            
            ctx.moveTo(barX + barRadius, barY);
            ctx.lineTo(barX + barWidth - barRadius, barY);
            ctx.quadraticCurveTo(barX + barWidth, barY, barX + barWidth, barY + barRadius);
            ctx.lineTo(barX + barWidth, barY + barHeight - barRadius);
            ctx.quadraticCurveTo(barX + barWidth, barY + barHeight, barX + barWidth - barRadius, barY + barHeight);
            ctx.lineTo(barX + barRadius, barY + barHeight);
            ctx.quadraticCurveTo(barX, barY + barHeight, barX, barY + barHeight - barRadius);
            ctx.lineTo(barX, barY + barRadius);
            ctx.quadraticCurveTo(barX, barY, barX + barRadius, barY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fill();
            
            // Text
            if (size >= 128) {
                ctx.font = `bold ${36 * scale}px Arial`;
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText('DodoTracker', 256 * scale, 438 * scale);
            }
        }
    </script>
</body>
</html>
